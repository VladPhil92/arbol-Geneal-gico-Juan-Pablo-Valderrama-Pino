name: Genealogy Research Agent

on:
  schedule:
    - cron: '17 5,17 * * *'
      timezone: 'America/Bogota'
  push:
    branches: [main]
    paths:
      - 'aportes-manuales/**'
      - 'familias/**'
      - 'entrevistas/**'
      - 'fuentes/**'
      - 'PROMPT_MAESTRO.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'research, validate o full'
        required: true
        default: 'research'
        type: choice
        options:
          - research
          - validate
          - full
      topic:
        description: 'ID opcional de agent/research_queue.json'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: genealogy-agent
  cancel-in-progress: false

jobs:
  research-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        run: python -m pip install -r agent/requirements.txt

      - name: Verify required secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Falta el secreto OPENAI_API_KEY en Settings > Secrets and variables > Actions."
            exit 2
          fi

      - name: Select execution mode
        id: config
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="research"
            TOPIC=""
          elif [ "${{ github.event_name }}" = "push" ]; then
            MODE="validate"
            TOPIC=""
          else
            MODE="${{ inputs.mode }}"
            TOPIC="${{ inputs.topic }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"

      - name: Create report branch
        id: branch
        shell: bash
        run: |
          BRANCH="agent/genealogy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run genealogy agent
        env:
          AGENT_MODE: ${{ steps.config.outputs.mode }}
          AGENT_TOPIC: ${{ steps.config.outputs.topic }}
          GIT_BEFORE: ${{ github.event.before }}
          GIT_AFTER: ${{ github.sha }}
        run: python agent/genealogy_agent.py

      - name: Commit generated reports
        id: commit
        shell: bash
        run: |
          if git status --porcelain investigacion/agente | grep -q .; then
            git config user.name "genealogy-research-agent[bot]"
            git config user.email "genealogy-research-agent[bot]@users.noreply.github.com"
            git add investigacion/agente
            git commit -m "research(agent): genealogy evidence report run ${GITHUB_RUN_ID}"
            git push --set-upstream origin "${{ steps.branch.outputs.name }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open auditable Pull Request
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          TITLE="research(agent): ${{ steps.config.outputs.mode }} genealogy report"
          BODY=$(cat <<'EOF'
          ## Informe automático del Agente Genealógico

          Esta PR contiene evidencia y propuestas generadas automáticamente. **No modifica el árbol genealógico canónico**: requiere revisión humana antes de incorporar cualquier filiación, fecha o parentesco.

          ### Controles epistemológicos
          - fuentes web tratadas como evidencia no confiable hasta ser cotejadas;
          - distinción A/B/C/D/E/X;
          - búsqueda de evidencia a favor y en contra;
          - conservación de contradicciones;
          - sin autopromoción de hipótesis a hechos.

          Revise especialmente las fuentes y documentos primarios solicitados en el informe.
          EOF
          )
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "$TITLE" \
            --body "$BODY"
